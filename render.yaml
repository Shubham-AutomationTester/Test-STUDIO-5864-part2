# Import this repository using New > Blueprint so these header rules apply.
services:
  - type: web
    name: studio-5864-robots-qa
    runtime: static
    buildCommand: echo Static fixtures are prebuilt
    staticPublishPath: ./docs
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, max-age=0
      - path: "/cases/h01/"
        name: "X-Robots-Tag"
        value: "noindex"
      - path: "/cases/h01/index.html"
        name: "X-Robots-Tag"
        value: "noindex"
      - path: "/cases/h02/"
        name: "X-Robots-Tag"
        value: "nofollow"
      - path: "/cases/h02/index.html"
        name: "X-Robots-Tag"
        value: "nofollow"
      - path: "/cases/h03/"
        name: "X-Robots-Tag"
        value: "noindex, nofollow"
      - path: "/cases/h03/index.html"
        name: "X-Robots-Tag"
        value: "noindex, nofollow"
      - path: "/cases/h04/"
        name: "X-Robots-Tag"
        value: "NOINDEX, NOFOLLOW"
      - path: "/cases/h04/index.html"
        name: "X-Robots-Tag"
        value: "NOINDEX, NOFOLLOW"
      - path: "/cases/h05/"
        name: "X-Robots-Tag"
        value: "noindex nofollow"
      - path: "/cases/h05/index.html"
        name: "X-Robots-Tag"
        value: "noindex nofollow"
      - path: "/cases/h06/"
        name: "x-RoBoTs-TaG"
        value: "noindex"
      - path: "/cases/h06/index.html"
        name: "x-RoBoTs-TaG"
        value: "noindex"
      - path: "/cases/h07/"
        name: "X-Robots-Tag"
        value: "noindex, nofollow"
      - path: "/cases/h07/index.html"
        name: "X-Robots-Tag"
        value: "noindex, nofollow"
      - path: "/cases/h08/restricted.txt"
        name: "X-Robots-Tag"
        value: "noindex"
      - path: "/cases/h09/"
        name: "X-Robots-Tag"
        value: "noindex"
      - path: "/cases/h09/index.html"
        name: "X-Robots-Tag"
        value: "noindex"
      - path: "/cases/h10/"
        name: "X-Robots-Tag"
        value: "noindex,nofollow"
      - path: "/cases/h10/index.html"
        name: "X-Robots-Tag"
        value: "noindex,nofollow"
      - path: "/cases/h11/"
        name: "X-Robots-Tag"
        value: "index,follow"
      - path: "/cases/h11/index.html"
        name: "X-Robots-Tag"
        value: "index,follow"
      - path: "/cases/h12/"
        name: "X-Robots-Tag"
        value: "googlebot: noindex,nofollow"
      - path: "/cases/h12/index.html"
        name: "X-Robots-Tag"
        value: "googlebot: noindex,nofollow"
      - path: "/cases/h13/"
        name: "X-Robots-Tag"
        value: "searchstax: noindex,nofollow"
      - path: "/cases/h13/index.html"
        name: "X-Robots-Tag"
        value: "searchstax: noindex,nofollow"
      - path: "/cases/h14/"
        name: "X-Robots-Tags"
        value: "noindex,nofollow"
      - path: "/cases/h14/index.html"
        name: "X-Robots-Tags"
        value: "noindex,nofollow"
      - path: "/cases/r06/blocked/"
        name: "X-Robots-Tag"
        value: "noindex,nofollow"
      - path: "/cases/r06/blocked/index.html"
        name: "X-Robots-Tag"
        value: "noindex,nofollow"
      - path: "/cases/u02/"
        name: "X-Robots-Tag"
